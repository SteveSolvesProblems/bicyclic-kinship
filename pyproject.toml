[project]
name = "bicyclic-kinship"
version = "0.1.0"
description = "A sound, set-valued model of relational composition, derived from opaque symbols. Zero dependencies."
authors = [{ name = "Steve Ball" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
keywords = ["clutrr", "kinship", "relational-reasoning", "bicyclic-monoid", "symbolic-reasoning", "abstract-interpretation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/SteveSolvesProblems/bicyclic-kinship"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bicyclic_kinship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
